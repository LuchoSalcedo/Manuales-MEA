events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
        keepalive 32;
        keepalive_timeout 120s;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name manualesmea.mx www.manualesmea.mx;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        # HTTP/2 desactivado temporalmente para debug de conexiones largas
        # http2 on;
        server_name manualesmea.mx www.manualesmea.mx;

        ssl_certificate /etc/letsencrypt/live/manualesmea.mx/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/manualesmea.mx/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 100M;

        # Backend API
        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts para consultas RAG que tardan
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Desactivar buffering para evitar timeouts en requests largos
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
